spring:
  application:
    name: oneuldo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}

rate-limit:
  trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
