spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/oneuldo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:oneuldo-user}
    password: ${DB_PASSWORD:qwer1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY:local-development-jwt-secret-key-32-characters}
    refreshKey: ${JWT_TOKEN_REFRESH_KEY:local-development-refresh-secret-key-32-characters}
    expiration:
      access: ${JWT_TOKEN_EXPIRATION_ACCESS:1800000}
      refresh: ${JWT_TOKEN_EXPIRATION_REFRESH:1209600000}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  credentials:
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL}
    upload-prefix: ${AWS_S3_UPLOAD_PREFIX:uploads}
  rekognition:
    max-labels: ${AWS_REKOGNITION_MAX_LABELS:30}
    min-confidence: ${AWS_REKOGNITION_MIN_CONFIDENCE:40}