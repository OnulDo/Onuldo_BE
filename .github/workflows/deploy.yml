name: Spring Boot CI/CD

on:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Windows에서 만든 gradlew는 Linux 실행 권한이 없을 수 있다.
      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Spring Boot JAR
        run: ./gradlew clean bootJar -x test

      - name: EC2에 배포
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -e

          printf '%s\n' "$EC2_SSH_KEY" \
            | tr -d '\r' \
            > private_key.pem

          chmod 600 private_key.pem

          # plain.jar가 아닌 실행 가능한 Spring Boot JAR를 찾는다.
          jar_file=$(
            find build/libs \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-plain.jar' \
              | head -n 1
          )

          if [ -z "$jar_file" ]; then
            echo "실행 가능한 JAR를 찾을 수 없습니다."
            exit 1
          fi

          scp \
            -i private_key.pem \
            -o StrictHostKeyChecking=no \
            "$jar_file" \
            "$EC2_USER@$EC2_HOST:/home/$EC2_USER/app-new.jar"

          ssh \
            -i private_key.pem \
            -o StrictHostKeyChecking=no \
            "$EC2_USER@$EC2_HOST" "
              set -e

              sudo /usr/bin/install \
                -o root \
                -g root \
                -m 0644 \
                /home/$EC2_USER/app-new.jar \
                /opt/onuldo/app.jar

              rm -f /home/$EC2_USER/app-new.jar

              sudo /usr/bin/systemctl restart onuldo

              sleep 15

              systemctl is-active --quiet onuldo
            "

          rm -f private_key.pem
